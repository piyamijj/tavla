name: cyber_tavla
description: "Cyber Tavla - neon-themed backgammon (tavla) with local, bot and realtime online multiplayer."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Realtime multiplayer transport (matches the Node.js/Socket.io backend)
  socket_io_client: ^2.0.3+1

  # Local persistence for settings (sound, theme preference, player name)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true